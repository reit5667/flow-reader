name: FlowReader
options:
  bundleIdPrefix: com.flowreader
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  FlowReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FlowReader
        excludes:
          - "**/*.md"
    resources:
      - path: FlowReader/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowreader.app
        PRODUCT_NAME: FlowReader
        INFOPLIST_FILE: FlowReader/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
